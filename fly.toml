app = "mari-dogfood"
primary_region = "sjc"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  MARI_APP_URL = "https://demo.mari.guru"
  MARI_OAUTH_REDIRECT_BASE = "https://demo.mari.guru"
  MARI_LLM_PROVIDER = "gateway"
  MARI_LLM_MODEL = "deepseek-v4-flash"
  MARI_EMBEDDING_PROVIDER = "sentence-transformers"
  MARI_EMBEDDING_MODEL = "sentence-transformers/all-mpnet-base-v2"
  MARI_EMBEDDING_WARMUP = "true"
  MARI_SENTENCE_TRANSFORMERS_CACHE = "/data/models/sentence-transformers"
  MARI_VECTOR_URI = "/data/mari/vectors"
  MARI_VECTOR_CACHE = "/data/cache/vectors"
  MARI_ICEBERG_WAREHOUSE = "/data/mari/iceberg"
  MARI_REPO_AUDIT_DIR = "/data/mari/repo-audit"
  MARI_LLM_GATEWAY_URL = "https://api.deepseek.com"
  MARI_LLM_GATEWAY_COMPATIBILITY = "deepseek"
  MARI_AUTH_BYPASS = "false"
  MARI_AUTH_BYPASS_DEV_MODE = "false"

[[mounts]]
  source = "mari_data"
  destination = "/data"
  initial_size = "20gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2
