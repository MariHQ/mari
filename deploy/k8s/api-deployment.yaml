apiVersion: apps/v1
kind: Deployment
metadata:
  name: mari-api
  namespace: mari
spec:
  # The scheduler is process-local. Keep one replica until leader election or
  # an external scheduler is implemented; see docs/operations-slo.md.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mari-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mari-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: schema-migrations
          image: ghcr.io/marihq/mari-api:replace-with-digest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "mari_server.persistence.postgres.schema"]
          envFrom:
            - configMapRef:
                name: mari-config
            - secretRef:
                name: mari-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/marihq/mari-api:replace-with-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mari-config
            - secretRef:
                name: mari-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
