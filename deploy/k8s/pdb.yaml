apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mari-api
  namespace: mari
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mari-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mari-web
  namespace: mari
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mari-web
