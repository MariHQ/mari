{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mari-api}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mari
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mari-web}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mari
      app.kubernetes.io/component: web
{{- end }}
