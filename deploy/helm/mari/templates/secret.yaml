{{- if not .Values.secrets.existingSecret }}
{{- $password := required "secrets.databasePassword is required; see deploy/helm/mari/README.md" .Values.secrets.databasePassword }}
apiVersion: v1
kind: Secret
metadata:
  name: mari-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  MARI_DB: {{ printf "postgresql://%s:%s@postgres:5432/%s" .Values.postgresql.username $password .Values.postgresql.database | quote }}
{{- end }}
