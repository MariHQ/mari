AWSTemplateFormatVersion: "2010-09-09"
Description: Mari single-container Lambda with ephemeral embedded PostgreSQL

Parameters:
  ImageUri:
    Type: String
  HostedZoneId:
    Type: String
  DomainName:
    Type: String
    Default: cloud.mari.guru
  # Demo model wiring (optional). LlmDefault is a provider:model ref the boot
  # script pins into settings.llm, e.g. anthropic:claude-haiku-4-5-20251001.
  # Empty means no pinning: the dump's self-hosted default (ollama) stands and
  # the dock answers through the deterministic fallback.
  LlmDefault:
    Type: String
    Default: ""
  LlmKey:
    Type: String
    Default: ""
    NoEcho: true

Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Project
          Value: mari-cloud

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: mari-cloud
      Description: Mari web, API, and ephemeral embedded PostgreSQL
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt LambdaRole.Arn
      Architectures:
        - arm64
      MemorySize: 1024
      Timeout: 900
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          MARI_AUTH_BYPASS: "true"
          MARI_OLLAMA_HOST: http://127.0.0.1:11434
          MARI_PGDATA: /tmp/mari/pgdata
          MARI_BUILDS_DIR: /tmp/mari/builds
          MARI_LLM_DEFAULT: !Ref LlmDefault
          MARI_LLM_KEY: !Ref LlmKey
      Tags:
        - Key: Project
          Value: mari-cloud

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: mari-cloud
      ProtocolType: HTTP

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Function.Arn
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 30000

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Join ["/", [integrations, !Ref Integration]]

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref Function
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Project
          Value: mari-cloud

  ApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref Certificate
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomain
      Stage: !Ref DefaultStage

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomain.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomain.RegionalHostedZoneId

Outputs:
  FunctionName:
    Value: !Ref Function
  ApiEndpoint:
    Value: !GetAtt HttpApi.ApiEndpoint
  SiteUrl:
    Value: !Sub https://${DomainName}
