name: Publish customer container images

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, including the leading v
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      MARI_RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: server/Dockerfile
          - component: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          MARI_CHART_VERSION="$(awk '$1 == "version:" {print $2}' deploy/helm/mari/Chart.yaml)"
          if [[ ! "$MARI_RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release version must be vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix." >&2
            exit 1
          fi
          if [[ "$MARI_RELEASE_VERSION" != "v$MARI_CHART_VERSION" ]]; then
            echo "Release $MARI_RELEASE_VERSION does not match chart version $MARI_CHART_VERSION." >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: |
            ghcr.io/marihq/mari-${{ matrix.component }}:${{ env.MARI_RELEASE_VERSION }}
            ghcr.io/marihq/mari-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.MARI_RELEASE_VERSION }}
