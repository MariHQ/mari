name: Component tests

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mari-components
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: mari-components/pyproject.toml
      - run: python -m pip install -e .
      - run: |
          python -m unittest discover -s tests -v
          for package in packages/*; do
            if [ -d "$package/tests" ]; then
              python -m unittest discover -s "$package/tests" -v
            fi
          done
      - run: python -m examples.github_pipeline.main
        env:
          MARI_EXAMPLE_MODE: fake
          MARI_EXAMPLE_MODEL: fixture
          GITHUB_TOKEN: example-token
          GITHUB_REPOSITORY: acme/knowledge
          GITHUB_PATHS: README*,docs/**
          GITHUB_WEBHOOK_SECRET: example-webhook-secret
      - run: python -m examples.slack_event_pipeline.main
        env:
          MARI_EXAMPLE_MODE: fake
          SLACK_BOT_TOKEN: xoxb-example
          SLACK_SIGNING_SECRET: example-secret
          SLACK_REQUEST_TIMESTAMP: "1000"
          SLACK_CHANNELS: engineering
          SLACK_HISTORY_TOKEN: ""
          SLACK_ALLOWED_CHANNEL: C-ENG
      - run: python -m examples.trajectory_fast_path.main
        env:
          MARI_EXAMPLE_MODEL: fixture
          WORKFLOW_MATCH_MINIMUM_SCORE: "0.05"
      - run: python -m examples.knowledge_lifecycle.main
        env:
          MARI_EXAMPLE_MODEL: fixture
      - run: python -m examples.google_drive_change_stream.main
        env:
          MARI_EXAMPLE_MODE: fake
          GDRIVE_ACCESS_TOKEN: drive-example
          GDRIVE_FOLDER_ID: ""
          GDRIVE_CALLBACK_URL: https://knowledge.example/webhooks/google-drive
          GDRIVE_CHANNEL_ID: example-channel
          GDRIVE_CHANNEL_TOKEN: example-channel-token
          GDRIVE_NOTIFICATION_HEADERS_JSON: '{"X-Goog-Channel-ID":"example-channel","X-Goog-Channel-Token":"example-channel-token","X-Goog-Resource-ID":"example-resource","X-Goog-Resource-State":"change","X-Goog-Message-Number":"1"}'
      - run: python -m examples.verify_all
      - run: python -m compileall -q packages tests examples
      - run: python -m pip wheel . --no-deps --wheel-dir wheelhouse
