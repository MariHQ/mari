name: Live product canary

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Mari URL
        required: false
        default: https://demo.mari.guru
      allow_mutations:
        description: Run credential-gated connector and workflow mutations
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: live-product-canary
  cancel-in-progress: false

jobs:
  live-playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      MARI_E2E_BASE_URL: ${{ inputs.base_url || vars.MARI_E2E_BASE_URL || 'https://demo.mari.guru' }}
      MARI_E2E_EMAIL: ${{ secrets.MARI_E2E_EMAIL }}
      MARI_E2E_PASSWORD: ${{ secrets.MARI_E2E_PASSWORD }}
      MARI_E2E_EXPECTED_SOURCE: ${{ vars.MARI_E2E_EXPECTED_SOURCE || 'MariHQ/mari' }}
      MARI_E2E_AGENT: "1"
      MARI_E2E_MUTATIONS: ${{ inputs.allow_mutations && '1' || '0' }}
      MARI_E2E_GITHUB_TOKEN: ${{ secrets.MARI_E2E_GITHUB_TOKEN }}
      MARI_E2E_GITHUB_REPO: ${{ vars.MARI_E2E_GITHUB_REPO }}
      MARI_E2E_SLACK_BOT_TOKEN: ${{ secrets.MARI_E2E_SLACK_BOT_TOKEN }}
      MARI_E2E_SLACK_SIGNING_SECRET: ${{ secrets.MARI_E2E_SLACK_SIGNING_SECRET }}
      MARI_E2E_SLACK_CHANNEL_ID: ${{ vars.MARI_E2E_SLACK_CHANNEL_ID }}
      MARI_E2E_CONFLUENCE_SITE_URL: ${{ vars.MARI_E2E_CONFLUENCE_SITE_URL }}
      MARI_E2E_CONFLUENCE_EMAIL: ${{ secrets.MARI_E2E_CONFLUENCE_EMAIL }}
      MARI_E2E_CONFLUENCE_API_TOKEN: ${{ secrets.MARI_E2E_CONFLUENCE_API_TOKEN }}
      MARI_E2E_GDRIVE_ACCESS_TOKEN: ${{ secrets.MARI_E2E_GDRIVE_ACCESS_TOKEN }}
      MARI_E2E_GDRIVE_REFRESH_TOKEN: ${{ secrets.MARI_E2E_GDRIVE_REFRESH_TOKEN }}
      MARI_E2E_GDRIVE_CLIENT_ID: ${{ secrets.MARI_E2E_GDRIVE_CLIENT_ID }}
      MARI_E2E_GDRIVE_CLIENT_SECRET: ${{ secrets.MARI_E2E_GDRIVE_CLIENT_SECRET }}
      MARI_E2E_GDRIVE_FOLDER_ID: ${{ vars.MARI_E2E_GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require live login credentials
        run: test -n "$MARI_E2E_EMAIL" && test -n "$MARI_E2E_PASSWORD"
      - run: npm run e2e:live
