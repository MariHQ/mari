name: Make customer container images public

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-visibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Make GHCR packages anonymously pullable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /orgs/${{ github.repository_owner }}/packages/container/mari-api -f visibility=public
          gh api --method PATCH /orgs/${{ github.repository_owner }}/packages/container/mari-web -f visibility=public
