name: Production reliability soak

on:
  schedule:
    - cron: "17 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-reliability-soak
  cancel-in-progress: false

jobs:
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f docker-compose.yml -f deploy/integration/docker-compose.yml
      MARI_LOAD_DURATION_SECONDS: "180"
      MARI_LOAD_CONCURRENCY: "24"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run production stack, sustained load, recovery, restore, and browser contracts
        run: make test-integration
      - name: Capture failure diagnostics
        if: failure()
        run: |
          mkdir -p .artifacts/reliability-soak
          $COMPOSE ps > .artifacts/reliability-soak/compose-ps.txt
          $COMPOSE logs --no-color > .artifacts/reliability-soak/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reliability-soak-failures
          path: |
            .artifacts/reliability-soak
            .artifacts/playwright
            .artifacts/playwright-report
          if-no-files-found: ignore
      - name: Tear down stack
        if: always()
        run: $COMPOSE down -v --remove-orphans
