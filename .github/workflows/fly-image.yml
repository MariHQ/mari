name: Fly production image

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fly-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build, boot, restart, and probe the 2 GB production image
        run: make test-fly-image
      - name: Capture container diagnostics
        if: failure()
        run: docker logs mari-fly-smoke > fly-image.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fly-image-failure
          path: fly-image.log
          if-no-files-found: ignore
