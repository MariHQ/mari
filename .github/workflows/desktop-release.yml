name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.0.1

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            slug: macos-arm64
            os: macos-15
            platform: darwin
            arch: arm64
            args: --mac --arm64
          - name: macOS Intel
            slug: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
            args: --mac --x64
          - name: Windows
            slug: windows-x64
            os: windows-2025
            platform: win32
            arch: x64
            args: --win --x64
          - name: Linux
            slug: linux-x64
            os: ubuntu-24.04
            platform: linux
            arch: x64
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: npm ci
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: python -m pip install -r ../server/requirements.txt pyinstaller
      - run: npm run prepare:resources
        env:
          MARI_TARGET_PLATFORM: ${{ matrix.platform }}
          MARI_TARGET_ARCH: ${{ matrix.arch }}
      - run: npm run build:api
        env:
          PYTHON: python
      - run: npm run dist -- ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.slug }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release/*
