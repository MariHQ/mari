name: Live connector canaries

on:
  schedule:
    - cron: "23 15 * * 2"
  workflow_dispatch:
    inputs:
      allow_mutations:
        description: Create sandbox sources and run the full live workflow suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: connector-canaries
  cancel-in-progress: false

jobs:
  priority-connectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: connector-canary
    env:
      MARI_E2E_EXTERNAL_SERVER: "1"
      MARI_E2E_LIVE: "1"
      MARI_E2E_BASE_URL: ${{ secrets.MARI_E2E_BASE_URL }}
      MARI_E2E_EMAIL: ${{ secrets.MARI_E2E_EMAIL }}
      MARI_E2E_PASSWORD: ${{ secrets.MARI_E2E_PASSWORD }}
      MARI_E2E_CONFLUENCE_SITE_URL: ${{ secrets.MARI_E2E_CONFLUENCE_SITE_URL }}
      MARI_E2E_CONFLUENCE_EMAIL: ${{ secrets.MARI_E2E_CONFLUENCE_EMAIL }}
      MARI_E2E_CONFLUENCE_API_TOKEN: ${{ secrets.MARI_E2E_CONFLUENCE_API_TOKEN }}
      MARI_E2E_SLACK_BOT_TOKEN: ${{ secrets.MARI_E2E_SLACK_BOT_TOKEN }}
      MARI_E2E_SLACK_CHANNELS: ${{ secrets.MARI_E2E_SLACK_CHANNELS }}
      MARI_E2E_GDRIVE_ACCESS_TOKEN: ${{ secrets.MARI_E2E_GDRIVE_ACCESS_TOKEN }}
      MARI_E2E_GDRIVE_FOLDER_ID: ${{ secrets.MARI_E2E_GDRIVE_FOLDER_ID }}
      MARI_E2E_GITHUB_TOKEN: ${{ secrets.MARI_E2E_GITHUB_TOKEN }}
      MARI_E2E_GITHUB_REPO: ${{ secrets.MARI_E2E_GITHUB_REPO }}
      MARI_E2E_SLACK_SIGNING_SECRET: ${{ secrets.MARI_E2E_SLACK_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Require the priority connector sandbox contract
        shell: bash
        run: |
          required=(
            MARI_E2E_BASE_URL MARI_E2E_EMAIL MARI_E2E_PASSWORD
            MARI_E2E_CONFLUENCE_SITE_URL MARI_E2E_CONFLUENCE_EMAIL MARI_E2E_CONFLUENCE_API_TOKEN
            MARI_E2E_SLACK_BOT_TOKEN MARI_E2E_GDRIVE_ACCESS_TOKEN
            MARI_E2E_GITHUB_TOKEN MARI_E2E_GITHUB_REPO
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::connector-canary environment is missing $key"
              exit 1
            fi
          done
      - name: Validate Confluence, Slack, Drive, and GitHub without writes
        working-directory: web
        run: >-
          npx playwright test e2e/production.live.spec.ts
          --project=live-chromium
          --grep="validates credentials without storing them"
          --reporter=line
      - name: Run mutation-enabled sandbox workflows
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_mutations }}
        working-directory: web
        env:
          MARI_E2E_MUTATIONS: "1"
        run: npx playwright test e2e/production.live.spec.ts --project=live-chromium --reporter=line
