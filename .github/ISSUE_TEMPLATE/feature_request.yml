name: Feature request
description: Propose a change or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For anything larger than a small change, it saves everyone a rewrite to agree on the
        approach here before the code gets written.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Mari makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: How you would like it to work. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you tried, or other designs you weighed.
    validations:
      required: false
