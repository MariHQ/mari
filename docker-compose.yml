# Mari — one-command deploy: `cp .env.example .env && docker compose up --build`
# Web UI on http://localhost:8080. First-run admin token: `docker compose logs api`.

# Images below are pinned by tag only. To pin by digest instead:
#   docker buildx imagetools inspect pgvector/pgvector:pg16 --format '{{.Manifest.Digest}}'
# then use image: pgvector/pgvector:pg16@sha256:<digest>.
services:
  db:
    image: pgvector/pgvector:pg16
    # Published so the API and web can run natively while Postgres stays in a
    # container — pgvector is the one dependency that is awkward to install
    # locally. Running the API on the host is how you reach an Ollama that is
    # also on the host: from inside a container, "localhost" is the container.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: mari
      # MARI_DB_PASSWORD in .env overrides the default (Compose reads .env for
      # this substitution). Postgres only applies it when the data volume is
      # first initialised; change it later with ALTER ROLE or a fresh volume.
      POSTGRES_PASSWORD: ${MARI_DB_PASSWORD:-mari}
      POSTGRES_DB: mari_cloud
    volumes:
      - mari-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mari -d mari_cloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot, lock-serialized schema migration using the production API image.
  # The API repeats the same check at startup so non-Compose deployments are
  # safe too; the checksum ledger turns that repeat into a no-op.
  db-init:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: mari-cloud-api:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARI_DB: postgresql://mari:${MARI_DB_PASSWORD:-mari}@db:5432/mari_cloud
    command: ["python", "-m", "mari_server.persistence.postgres.schema"]
    restart: "no"

  api:
    image: mari-cloud-api:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      MARI_DB: postgresql://mari:${MARI_DB_PASSWORD:-mari}@db:5432/mari_cloud
      # Ollama running on the docker host (optional — the app degrades
      # gracefully without it). To use the compose-managed ollama service
      # below instead, change this to http://ollama:11434.
      MARI_OLLAMA_HOST: ${MARI_OLLAMA_HOST:-http://host.docker.internal:11434}
      # OAuth credentials come from .env (see .env.example), e.g.:
      # MARI_GITHUB_CLIENT_ID / MARI_GITHUB_CLIENT_SECRET
      # MARI_GOOGLE_CLIENT_ID / MARI_GOOGLE_CLIENT_SECRET
      #
      # Object storage for backups and rebuildable artifacts.
      MARI_S3_BUCKET: ${MARI_S3_BUCKET:-}
      # Credentials come from the standard AWS chain. In production that is the
      # task or instance role and none of this applies. Locally, mount ~/.aws
      # through docker-compose.override.yml (see the .example file) and name a
      # profile here to pick from it.
      AWS_PROFILE: ${AWS_PROFILE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux (no-op on Docker Desktop).
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    # Context is the repo root, not web/: the app compiles against the
    # component library in the vendor/mari-design submodule.
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Optional: run ollama inside compose instead of on the host.
  # Uncomment this service, set MARI_OLLAMA_HOST=http://ollama:11434 in .env,
  # then pull the models the app expects:
  #   docker compose exec ollama ollama pull nomic-embed-text
  #   docker compose exec ollama ollama pull gemma3:4b
  #
  # ollama:
  #   image: ollama/ollama
  #   volumes:
  #     - mari-ollama-data:/root/.ollama

volumes:
  mari-db-data:
  # mari-ollama-data:
